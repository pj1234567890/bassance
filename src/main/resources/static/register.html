<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register | EDM Classifier</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body class="auth-page">
<div class="card">
    <h2>Register</h2>
    <div class="error" id="err"></div>
    <input type="text" id="name" placeholder="Name" maxlength="100">
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Password" minlength="12" maxlength="72" autocomplete="new-password">
    <button id="registerButton">Create Account</button>
    <div class="link">
        Already have an account? <a href="login.html">Login</a>
    </div>
</div>

<script src="/js/register.js" defer></script>
</body>
</html>
