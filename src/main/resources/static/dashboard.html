<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard | EDM Classifier</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body class="dashboard-page">

<header>
    <div>🎵 EDM Classifier</div>
    <button id="logoutButton">Logout</button>
</header>

<main>

    <div class="card">
        <h2>Upload Track</h2>
        <input type="file" id="file" accept=".mp3,.wav,.flac,.ogg,.m4a,audio/*">
        <button id="uploadButton">Upload & Analyze</button>
        <div id="uploadStatus" class="small"></div>
    </div>

    <div class="card">
        <h2>Recent Tracks</h2>
        <table>
            <thead>
            <tr>
                <th>Name</th>
                <th>Genres</th>
                <th>Uploaded</th>
            </tr>
            </thead>
            <tbody id="tracksBody"></tbody>
        </table>
    </div>

</main>

<script src="/js/dashboard.js" defer></script>

</body>
</html>
