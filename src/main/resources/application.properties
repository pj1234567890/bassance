spring.application.name=edm_app
spring.config.import=optional:file:./.env[.properties]
server.port=${PORT:3000}
server.forward-headers-strategy=framework
server.error.include-message=never

# 1. Extreme low-CPU startup optimizations
spring.main.lazy-initialization=true
spring.jmx.enabled=false
spring.jpa.open-in-view=false

# 2. Kill DB boot-time metadata inspection
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# 3. Connection & Pool
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=15000
spring.datasource.hikari.initialization-fail-timeout=15000

# 4. Limit Tomcat thread allocation
server.tomcat.threads.max=15
server.tomcat.threads.min-spare=2
server.tomcat.accept-count=10

# 5. Flyway
spring.flyway.enabled=true

jwt.secret=${JWT_SECRET}
jwt.expiry-ms=${JWT_EXPIRY_MS:3600000}
app.cookie.secure=${COOKIE_SECURE:true}
app.ml.url=${ML_SERVICE_URL:http://${ML_SERVICE_HOSTPORT:localhost:8001}}
app.ml.token=${ML_SERVICE_TOKEN}
app.upload.max-bytes=${MAX_UPLOAD_BYTES:52428800}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
