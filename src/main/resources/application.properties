spring.application.name=edm_app
spring.config.import=optional:file:./.env[.properties]
server.port=${PORT:3000}
server.forward-headers-strategy=framework
server.error.include-message=never

# Fast startup optimizations
spring.main.lazy-initialization=true
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=51MB

spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:edm_app}}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# HikariCP Pool Configuration with Fail-Fast timeout
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:3}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:0}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT_MS:30000}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:10000}
spring.datasource.hikari.initialization-fail-timeout=10000

# JPA & Migration (ddl-auto set to none to stop remote schema validation overhead; Flyway manages schema)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.flyway.enabled=true

jwt.secret=${JWT_SECRET}
jwt.expiry-ms=${JWT_EXPIRY_MS:3600000}
app.cookie.secure=${COOKIE_SECURE:true}
app.ml.url=${ML_SERVICE_URL:http://${ML_SERVICE_HOSTPORT:localhost:8001}}
app.ml.token=${ML_SERVICE_TOKEN}
app.upload.max-bytes=${MAX_UPLOAD_BYTES:52428800}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
