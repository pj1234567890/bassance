name: Publish ML service image

on:
  push:
    branches:
      - main
    paths:
      - "src/main/java/com/example/edm_app/ml_service/**"
      - ".github/workflows/publish-ml-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: src/main/java/com/example/edm_app/ml_service
          file: src/main/java/com/example/edm_app/ml_service/Dockerfile
          platforms: linux/amd64
          push: true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/bassance-ml:latest
            ghcr.io/${{ github.repository_owner }}/bassance-ml:${{ github.sha }}
